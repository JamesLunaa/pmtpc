name: Windows build

on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with SignPath (each signing request needs approval in SignPath)
        type: boolean
        default: false

permissions:
  contents: write # create releases on tags
  actions: read # lets SignPath read job details and download the unsigned artifacts

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --group build

      - name: Test
        run: uv run pytest -q

      - name: Version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "$(uv version --short)-dev.$("${{ github.sha }}".Substring(0, 7))"
          }
          $numeric = ([regex]::Match($version, '^\d+\.\d+\.\d+')).Value + ".0"
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT

      # Signing runs once SignPath is set up (repo variable SIGNPATH_ORGANIZATION_ID and secret
      # SIGNPATH_API_TOKEN), for release tags or when requested on a manual run.
      - name: Decide signing
        id: sign
        run: |
          $configured = "${{ vars.SIGNPATH_ORGANIZATION_ID }}" -ne ""
          $wanted = "${{ github.ref_type }}" -eq "tag" -or "${{ inputs.sign }}" -eq "true"
          if ($wanted -and -not $configured) {
            Write-Output "::warning::SignPath is not configured; this build is unsigned and Smart App Control will block it."
          }
          "enabled=$("$($configured -and $wanted)".ToLower())" >> $env:GITHUB_OUTPUT

      - name: Build exe
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          uv run python -m pmtpc.icon build/pmtpc.ico
          uv run python packaging/windows/version_info.py "${{ steps.version.outputs.version }}" build/version_info.txt
          uv run pyinstaller --noconfirm --windowed --name pmtpc `
            --icon build/pmtpc.ico --version-file build/version_info.txt `
            --paths . --hidden-import pystray._win32 `
            packaging/windows/launcher.py

      - name: Upload unsigned exe
        id: upload-exe
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pmtpc-exe-unsigned
          path: dist/pmtpc

      - name: Sign exe
        if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pmtpc' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600 # leaves time to approve the request
          output-artifact-directory: dist/pmtpc-signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $buildDir = if ("${{ steps.sign.outputs.enabled }}" -eq "true") { "$PWD\dist\pmtpc-signed" } else { "$PWD\dist\pmtpc" }
          iscc /DAppVersion=${{ steps.version.outputs.version }} /DNumericVersion=${{ steps.version.outputs.numeric }} `
            /DBuildDir="$buildDir" /DIconFile="$PWD\build\pmtpc.ico" /O"$PWD\dist\installer" `
            packaging/windows/pmtpc.iss

      - name: Upload unsigned installer
        id: upload-installer
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pmtpc-setup-unsigned
          path: dist/installer/pmtpc-setup-*.exe

      - name: Sign installer
        if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pmtpc' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/release
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Collect installer
        if: steps.sign.outputs.enabled != 'true'
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/installer/pmtpc-setup-*.exe dist/release/

      - uses: actions/upload-artifact@v7
        with:
          name: pmtpc-setup-${{ steps.version.outputs.version }}
          path: dist/release/pmtpc-setup-*.exe

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/release/pmtpc-setup-*.exe).FullName --title "${{ github.ref_name }}" --generate-notes
