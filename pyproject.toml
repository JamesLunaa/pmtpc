[project]
name = "pmtpc"
version = "0.1.1"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "sounddevice>=0.5.6",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
